name: Tag
on:
  push:
    tags:
      - "v3.*"
  workflow_dispatch:

jobs:
  tag:
    if: startsWith(github.ref, 'refs/tags/v3.') && !contains(github.ref_name, '-')
    name: Add tag to source repo
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v3\.[0-9]+\.[0-9]+$ ]]'
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: AlistGo/desktop
          ref: v2
          token: ${{ secrets.MY_TOKEN }}

      - name: Add tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config --local user.email "i@nn.ci"
          git config --local user.name "Andy Hsu"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"

      - name: Push tags
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.MY_TOKEN }}
          repository: AlistGo/desktop