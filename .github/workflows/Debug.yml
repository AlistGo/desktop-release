# Temporary branch-only entry point: reuse signed trial artifacts, never publish a channel.
name: Desktop 4 Beta draft verification
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed six-platform draft build run'
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-v4-beta-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/v4-release.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify provenance and draft-only guard
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.run_id }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const id = process.env.ORIGINAL_RUN
          if (!/^[1-9][0-9]*$/.test(id)) throw new Error('Invalid run ID')
          const plan = JSON.parse(readFileSync('plan.json', 'utf8'))
          const run = JSON.parse(execFileSync('gh', ['api', `repos/AlistGo/desktop-release/actions/runs/${id}`], { encoding: 'utf8' }))
          if (plan.draftOnly !== true || plan.tag !== 'v4.0.0-beta.1' || plan.source !== 'd8ea3cea0778d1351481caeccc4c2eb5852aa55a' || plan.releaseCommit !== run.head_sha || run.status !== 'completed') throw new Error('Wrong source run or unsafe plan')
          plan.verificationCommit = process.env.GITHUB_SHA
          plan.buildRun = id
          writeFileSync('plan.json', JSON.stringify(plan, null, 2) + '\n')
          JS
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify signed artifacts and upload draft only
        run: node scripts/v4-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            plan.json
            latest.json
            ghfast.top.proxy.json
            provenance.json
            SHA256SUMS
            verified.json
          if-no-files-found: warn
